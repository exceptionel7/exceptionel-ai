<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exceptionel AI — Stripe Payments</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #0f1115; color: #e7e9ee; }
      header { padding: 18px 28px; border-bottom: 1px solid #262b36; display: flex; align-items: center; gap: 10px; }
      header .logo { color: #7c5cff; font-size: 22px; }
      header strong { font-size: 16px; } header small { display: block; color: #9aa2b1; font-size: 11px; }
      .badge { margin-left: auto; font-size: 12px; color: #9aa2b1; border: 1px solid #262b36; padding: 6px 10px; border-radius: 999px; }
      .wrap { max-width: 960px; margin: 0 auto; padding: 28px 20px 80px; }
      h1 { font-size: 26px; margin: 0 0 6px; } .lead { color: #9aa2b1; margin: 0 0 22px; }
      .banner { border-radius: 12px; padding: 14px 16px; font-size: 14px; margin-bottom: 20px; }
      .banner.ok { background: rgba(52,211,153,.12); border: 1px solid rgba(52,211,153,.4); color: #34d399; }
      .banner.warn { background: rgba(255,212,121,.08); border: 1px solid rgba(255,212,121,.3); color: #ffd479; }
      .banner.err { background: rgba(255,120,120,.1); border: 1px solid rgba(255,120,120,.4); color: #ff8080; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
      .card { background: #171a21; border: 1px solid #262b36; border-radius: 14px; padding: 18px; }
      .card .cat { font-size: 11px; text-transform: uppercase; color: #22d3ee; letter-spacing: .05em; }
      .card h3 { margin: 6px 0; } .card p { color: #9aa2b1; font-size: 13px; min-height: 40px; }
      .price { font-weight: 800; font-size: 20px; margin: 8px 0; }
      .btn { width: 100%; border: none; border-radius: 10px; padding: 11px; font-weight: 700; cursor: pointer; background: linear-gradient(135deg,#7c5cff,#5b8cff); color: #fff; font-size: 14px; }
      .btn:disabled { opacity: .6; cursor: wait; }
      .section { margin-top: 34px; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #262b36; }
      th { color: #9aa2b1; font-size: 12px; text-transform: uppercase; }
      .pill { font-size: 11px; padding: 3px 9px; border-radius: 999px; background: rgba(52,211,153,.15); color: #34d399; }
      .pill.mock { background: rgba(255,212,121,.12); color: #ffd479; }
      .empty { color: #9aa2b1; padding: 20px 0; }
    </style>
  </head>
  <body>
    <header>
      <span class="logo">✦</span>
      <div><strong>Exceptionel AI</strong><small>Payments &amp; orders (Stripe)</small></div>
      <span class="badge" id="mode-badge">…</span>
    </header>

    <div class="wrap">
      <h1>Demo store 💳</h1>
      <p class="lead">Click “Buy”: in live mode you're redirected to Stripe Checkout; in demo mode the payment is simulated.</p>

      <div id="banner"></div>

      <div class="grid" id="grid"></div>

      <div class="section">
        <h2>Orders</h2>
        <div id="orders"><p class="empty">Loading…</p></div>
      </div>
    </div>

    <script>
      var $ = function (s) { return document.querySelector(s); };
      function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }
      function money(cents, cur){ try { return new Intl.NumberFormat("en-US",{style:"currency",currency:(cur||"usd").toUpperCase()}).format((cents||0)/100);}catch(e){return "$"+((cents||0)/100).toFixed(2);} }

      var PRODUCTS = [
        { id: "casque-serenity", name: "Serenity Headphones", category: "Audio", price_cents: 19900, currency: "usd", description: "Wireless headphones with active noise cancellation, 40h battery life." },
        { id: "adaptateur-2en1", name: "2-in-1 Adapter", category: "Accessories", price_cents: 1000, currency: "usd", description: "Charge AND listen at the same time. No more dilemma." },
        { id: "gourde-pure", name: "Pure Insulated Bottle", category: "Lifestyle", price_cents: 3490, currency: "usd", description: "Keeps cold for 24h, hot for 12h." }
      ];

      // Banner based on the return from Stripe
      (function () {
        var p = new URLSearchParams(location.search);
        var b = $("#banner");
        if (p.get("paid")) { b.innerHTML = '<div class="banner ok">✅ Payment confirmed ' + (p.get("demo") ? "(simulated — demo mode)" : "") + " — thank you! Order: " + esc(p.get("session") || "") + "</div>"; }
        else if (p.get("canceled")) { b.innerHTML = '<div class="banner warn">Payment canceled. You can try again.</div>'; }
      })();

      // Mode badge
      fetch("/api/health").then(function(r){return r.json();}).then(function(h){
        $("#mode-badge").textContent = "payments: " + h.payments + (h.key_type && h.key_type!=="demo" ? " ("+h.key_type+")" : "");
      }).catch(function(){});

      // Products
      var grid = $("#grid");
      grid.innerHTML = PRODUCTS.map(function (p) {
        return '<div class="card"><div class="cat">' + esc(p.category) + "</div>" +
          "<h3>" + esc(p.name) + "</h3><p>" + esc(p.description) + "</p>" +
          '<div class="price">' + money(p.price_cents, p.currency) + "</div>" +
          '<button class="btn" data-id="' + esc(p.id) + '">Buy</button></div>';
      }).join("");

      grid.querySelectorAll(".btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var product = PRODUCTS.filter(function (p) { return p.id === btn.dataset.id; })[0];
          btn.disabled = true; btn.textContent = "Redirecting…";
          fetch("/api/checkout", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ product: product, origin: location.origin })
          }).then(function (r) { return r.json(); }).then(function (d) {
            if (d.url) { location.href = d.url; }
            else { btn.disabled = false; btn.textContent = "Buy"; alert("Error: " + (d.error || "unknown")); }
          }).catch(function (e) { btn.disabled = false; btn.textContent = "Buy"; alert("Error: " + e.message); });
        });
      });

      // Orders
      function loadOrders() {
        fetch("/api/orders").then(function(r){return r.json();}).then(function(d){
          var box = $("#orders");
          if (!d.orders || !d.orders.length) { box.innerHTML = '<p class="empty">No orders yet.</p>'; return; }
          box.innerHTML = "<table><thead><tr><th>Order</th><th>Product</th><th>Amount</th><th>Email</th><th>Status</th><th>Date</th></tr></thead><tbody>" +
            d.orders.map(function (o) {
              return "<tr><td>" + esc((o.id||"").slice(0,18)) + "</td><td>" + esc(o.product || o.product_id || "—") + "</td><td>" + money(o.amount_cents, o.currency) + "</td><td>" + esc(o.email || "—") + '</td><td><span class="pill ' + (o.mock?"mock":"") + '">' + esc(o.status || "paid") + (o.mock?" (demo)":"") + "</span></td><td>" + esc((o.createdAt||"").slice(0,10)) + "</td></tr>";
            }).join("") + "</tbody></table>";
        }).catch(function(){ $("#orders").innerHTML = '<p class="empty">Could not load orders.</p>'; });
      }
      loadOrders();
      setTimeout(loadOrders, 1500); // refresh after a possible payment
    </script>
  </body>
</html>
